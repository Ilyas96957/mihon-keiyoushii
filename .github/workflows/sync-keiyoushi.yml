name: Sync Keiyoushi Extensions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official Keiyoushi index
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.json \
            -o official-index.json

      - name: Download official icons
        run: |
          git clone --depth 1 --branch repo \
            https://github.com/keiyoushi/extensions.git official-keiyoushi

      - name: Build compatible index.min.json
        run: |
          python3 <<'PY'
          import json
          import shutil
          from pathlib import Path
          from urllib.parse import urlparse

          OLD_INDEX = Path("index.min.json")
          OFFICIAL_INDEX = Path("official-index.json")

          old_data = json.loads(
              OLD_INDEX.read_text(encoding="utf-8")
          )

          official_data = json.loads(
              OFFICIAL_INDEX.read_text(encoding="utf-8")
          )

          official_extensions = official_data["extensionList"]["extensions"]

          # Match official extensions by package name.
          official_by_package = {}

          for ext in official_extensions:
              package = ext.get("packageName")

              if package:
                  official_by_package[package] = ext

          updated = 0
          sources_updated = 0
          missing = 0

          for item in old_data:

              package = item.get("pkg", "")
              official = official_by_package.get(package)

              if not official:
                  missing += 1
                  continue

              resources = official.get("resources", {})

              # -------------------------------------------------
              # Official APK URL
              # -------------------------------------------------

              apk_url = resources.get("apkUrl", "")

              if apk_url:
                  item["apk"] = apk_url
                  updated += 1

              # -------------------------------------------------
              # Official sources
              # Convert current Keiyoushi format to the older
              # index.min.json format used by this repository.
              # -------------------------------------------------

              official_sources = official.get("sources", [])

              converted_sources = []

              for source in official_sources:

                  source_item = {
                      "name": source.get("name", ""),
                      "lang": source.get("language", ""),
                      "id": str(source.get("id", "")),
                      "baseUrl": source.get("homeUrl", "")
                  }

                  # Keep mirror URLs when available.
                  if source.get("mirrorUrls"):
                      source_item["baseUrl"] = source["mirrorUrls"][0]

                  converted_sources.append(source_item)

              if converted_sources:
                  item["sources"] = converted_sources
                  sources_updated += 1

          # -----------------------------------------------------
          # Save minified JSON
          # -----------------------------------------------------

          OLD_INDEX.write_text(
              json.dumps(
                  old_data,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print("========================================")
          print("Keiyoushi synchronization completed")
          print("========================================")
          print(f"Total old extensions : {len(old_data)}")
          print(f"APK links updated    : {updated}")
          print(f"Sources updated      : {sources_updated}")
          print(f"Not found officially : {missing}")
          print("========================================")

          # -----------------------------------------------------
          # Copy official icons
          # -----------------------------------------------------

          source_icons = Path("official-keiyoushi/icon")
          destination_icons = Path("icon")

          if destination_icons.exists():
              shutil.rmtree(destination_icons)

          shutil.copytree(
              source_icons,
              destination_icons
          )

          icon_count = len(
              list(destination_icons.iterdir())
          )

          print(f"Icons copied         : {icon_count}")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.min.json icon

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Keiyoushi extensions"
            git push
          fi
